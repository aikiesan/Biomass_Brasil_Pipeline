# =============================================================================
# Biomass Brasil Pipeline — main configuration
# =============================================================================
# Every path under `inputs` is relative to `raw_root`. `raw_root` is itself
# relative to the repository root unless absolute. Override any of these on a
# given machine with config/paths.local.yaml (git-ignored), e.g.
#
#   raw_root: "C:/Users/Lucas/Documents/Reposicionamento_Submissão_ESD"
#
# =============================================================================

raw_root: ".."            # default: the folder that contains this repository
data_dir: "data"          # outputs (relative to the repository root)

years:
  start: 2008
  end: 2025               # MapBiomas Col. 11 and PAM/PPM reach 2025 (2025 is preliminary in PAM/PPM)

inputs:
  municipalities_shp: "00_Primary_Data_Sources_PILAR2b/01_IBGE_Shapefiles/BR_Municipios_2025/BR_Municipios_2025.shp"

  mapbiomas_municipal_xlsx: "MapBiomas_Update_2025_Colecao_11/MAPBIOMAS_BRAZIL-COL.11-BIOME_STATE_MUNICIPALITY_2025/MAPBIOMAS_BRAZIL-COL.11-BIOME_STATE_MUNICIPALITY.xlsx"
  mapbiomas_legend_csv: "MapBiomas_Update_2025_Colecao_11/legend_code_mapbiomas_brazil_collection_11.csv"
  # Irrigation systems (center pivot, other systems) by municipality and irrigated crop: H2 predictor
  mapbiomas_irrigation_xlsx: "MapBiomas_Update_2025_Colecao_11/MAPBIOMAS-BRAZIL-IRRIGATION-SYSTEMS-MUNICIPALITY-COLLECTION_11.xlsx"


  second_crop_tif_dir: "00_Primary_Data_Sources_PILAR2b/07_MapBiomas/Segunda_Safra_TIF"
  # Collection 11 coverage rasters (30 m), one per year: border-share predictor (bbp border-share)
  coverage_tif_dir: "00_Primary_Data_Sources_PILAR2b/07_MapBiomas/Cobertura_Col11_TIF"
  # landsat_valid_obs_<year>.csv exported by docs/gee/landsat_valid_observations.js: H2 cloud proxy
  landsat_valid_obs_dir: "00_Primary_Data_Sources_PILAR2b/07_MapBiomas/Landsat_Valid_Obs"
  # National series exported from the MapBiomas platform; used only as an invariant check
  second_crop_national_csv: "00_Primary_Data_Sources_PILAR2b/11_Analises_Complementares/Milho2_Serasa/Série temporal de Agricultura • Uso agrícola - Segunda safra por classe • 2000 - 2024.csv"

# -----------------------------------------------------------------------------
# IBGE SIDRA tables (PAM = crops, PPM = livestock), municipal level.
# Each table: the exports that make up its series (CSV or XLSX, one file per
# block of years). Where files overlap, the one listed LAST wins, so list the
# newest export last. `products` (optional) keeps only those columns; without
# it every product is kept. `exclude_products` drops columns that are not data
# (e.g. "Total" of table 74 adds litres, dozens and kilograms).
# IBGE publishes the newest year of every table as PRELIMINARY; the ingest
# flags it, and warns when the year before it comes from an export in which it
# was still the newest (i.e. preliminary, possibly revised since).
# -----------------------------------------------------------------------------
sidra:
  5457:
    survey: PAM
    description: "Crops (temporary + permanent): area planted or destined for harvest, harvested, production"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_CONAB/tabela5457.csv"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_CONAB/tabela5457 (1).csv"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela5457_PAM_2025.xlsx"
    # the 2008–2024 exports hold only these seven products; the 2025 export holds all 86
    products: ["Arroz (em casca)", "Café (em grão) Total", "Cana-de-açúcar", "Laranja", "Milho (em grão)",
               "Soja (em grão)", "Trigo (em grão)"]
  839:
    survey: PAM
    description: "Corn by season (1st / 2nd)"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_CONAB/PAM_tabela839_milho_por_safra.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela839_PAM_2025.xlsx"
  1612:
    survey: PAM
    description: "Temporary crops"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1612_2012_A_2008.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1612_2016_A_2013.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1612_2020_A_2017.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1612_2024_A_2021.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela1612_PAM_2025.xlsx"
    products: ["Cana-de-açúcar", "Soja (em grão)", "Milho (em grão)", "Arroz (em casca)",
               "Algodão herbáceo (em caroço)"]
  1613:
    survey: PAM
    description: "Permanent crops"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1613_2008_A_2011.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1613_2012_A_2015.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1613_2016_A_2020.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1613_2020_A_2023.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/PAM_1612_1613_raw/TABELA_1613_2024.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela1613_PAM_2025.xlsx"
    # Arábica and Canephora are parts of Total: kept for a containment check, never summed
    products: ["Café (em grão) Total", "Café (em grão) Arábica", "Café (em grão) Canephora", "Laranja"]
    subsets:
      - {total: "Café (em grão) Total", parts: ["Café (em grão) Arábica", "Café (em grão) Canephora"]}
  3939:
    survey: PPM
    description: "Herds (head, 31 Dec). 'Suíno - matrizes' and 'Galináceos - galinhas' are subsets of the totals"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/TABELA_3939_PPM_2008A2024.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela3939_PPM_2025.xlsx"
    # never add a subset to its total. IBGE itself has 4 cases where the subset exceeds the total
    # (2008–2025: Itaquara-BA 2021 swine; Primavera-PE 2020, Japeri-RJ 2017, Andradina-SP 2023 poultry),
    # hence "warn": reported, kept as published.
    subsets:
      - {total: "Suíno - total", parts: ["Suíno - matrizes de suínos"], severity: warn}
      - {total: "Galináceos - total", parts: ["Galináceos - galinhas"], severity: warn}
  74:
    survey: PPM
    description: "Animal products (milk, eggs, honey, ...); unit in the product name"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/TABELA_74_2008A2024.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela74_PPM_2025.xlsx"
    exclude_products: ["Total"]
  94:
    survey: PPM
    description: "Milked cows (head)"
    files:
      - "00_Primary_Data_Sources_PILAR2b/TABELA_94_VACAS_ORDENHADAS_PPM_2008_A2024.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela94_PPM_2025.xlsx"
  3940:
    survey: PPM
    description: "Aquaculture (from 2013); unit in the product name"
    files:
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/TABELA_3940_2008A2024.xlsx"
      - "00_Primary_Data_Sources_PILAR2b/04_IBGE_Tabelas/SIDRA_2025/tabela3940_PPM_2025.xlsx"
    exclude_products: ["Total"]
    # the fish aggregate is a header with no data (2013–2024: "Peixes"; 2024+: "Peixes (Quilogramas)"):
    # fish totals must be summed from the species columns. Warn if IBGE starts filling it.
    expected_empty: ["Peixes", "Peixes (Quilogramas)"]

# Variables dropped from every SIDRA table (derived from the others)
sidra_drop_variables: [yield_kg_ha]

# -----------------------------------------------------------------------------
# Municipal sanitation (urban solid waste, sewage): SNIS to 2022, SINISA from
# 2023. Which field of each survey feeds which variable is in
# config/sanitation.yaml. `bbp run sanitation` builds one harmonised series.
# -----------------------------------------------------------------------------
sanitation:
  snis:
    # "Consolidado por Município" exports of the SNIS série histórica (UTF-16, ';')
    dir: "00_Primary_Data_Sources_PILAR2b/03_SNIS_Series"
    pattern: "{year}_SNIS_ConsolidadoMunicipio-*.csv"
    years: [2008, 2022]
  sinisa:
    # one entry per reference year. `waste` and `sewage` are the municipal workbooks;
    # `sewage_published` is SINISA's own UF / macro-region / Brazil consolidation, used
    # to check the municipal sums; `waste_respondents` is the number of municipalities
    # SINISA reports as participants of the waste module.
    2023:
      waste: {file: "00_Primary_Data_Sources_PILAR2b/12_SINISA/2023/residuos/SINISA_RESIDUOS_Informacoes_Formulario_Manejo_2023.xlsx",
              sheet: "Manejo_Resíduos_Sólidos_Urbanos"}
      sewage: {file: "00_Primary_Data_Sources_PILAR2b/12_SINISA/2023/esgoto/base_municipal/SINISA_ESGOTO_Informacoes_Gestao Tecnica Esgoto_Base Municipal_2023_V2.xlsx",
               sheet: "Gestão Técnica de Esgoto"}
      sewage_published: {file: "00_Primary_Data_Sources_PILAR2b/12_SINISA/2023/esgoto/consolidado_uf_mr_br/SINISA_ESGOTO_Informacoes_Gestao Tecnica Esgoto_UF_Macrorregiao_Brasil_2023_V2.xlsx",
                         sheet: "Gestão Técnica de Esgoto"}
      waste_respondents: 4778   # SINISA waste report 015 (ref. 2023), p. 17
    2024:
      waste: {file: "00_Primary_Data_Sources_PILAR2b/12_SINISA/2024/residuos/SINISA_RESIDUOS_Informacoes_Formulario_Manejo_2024.xlsx",
              sheet: "Manejo_Resíduos_Sólidos_Urbanos"}
      sewage: {file: "00_Primary_Data_Sources_PILAR2b/12_SINISA/2024/esgoto/base_municipal/SINISA_ESGOTO_Informações_Gestão Técnica de Esgoto_Base Municipal_2024.xlsx",
               sheet: "Gestão Técnica de Esgoto"}
      sewage_published: {file: "00_Primary_Data_Sources_PILAR2b/12_SINISA/2024/esgoto/consolidado_uf_mr_br/SINISA_ESGOTO_Informações_Gestão Técnica de Esgoto_UF_MR_BR_2024.xlsx",
                         sheet: "Gestão Técnica de Esgoto"}
      waste_respondents: 4854   # SINISA waste report 010 (ref. 2024), p. 18
  # municipal sums vs SINISA's consolidation, and SNIS municipal sums vs its own
  # "TOTAL da AMOSTRA" row: allowed relative difference
  published_tolerance: 0.01
  # series break SNIS -> SINISA: municipalities reporting both in the last SNIS and the
  # first SINISA year. Warn when the median ratio SINISA/SNIS leaves this band.
  continuity_band: [0.8, 1.25]

mapbiomas:
  collection: 11
  sheet: "COVERAGE_11"
  # Guard against class renumbering between collections: the level-4 label of
  # each crop class in the sheet must contain this text.
  expected_labels:
    20: "Sugar cane"
    39: "Soybean"
    40: "Rice"
    46: "Coffee"
    47: "Citrus"
    62: "Cotton"

second_crop:
  tif_pattern: "{year}_agriculture_agricultural_use_second_crop_*.tif"
  # Pixel values in the MapBiomas second-crop rasters. Any other non-zero value
  # is accumulated as `other_2nd`.
  classes:
    1: corn_2nd
    62: cotton_2nd
    41: other_2nd         # "outras culturas de segunda safra / cobertura"
  window: 2048            # processing window (pixels); 2048 keeps peak RAM < 1 GB
  # Name of the column in the national series CSV for each class (invariant check)
  national_series_labels:
    corn_2nd: "Milho de segunda safra"
    cotton_2nd: "Algodão de segunda safra"
    other_2nd: "Outras culturas de segunda safra / Cobertura"
  national_tolerance: 0.005 # |pipeline − MapBiomas| / MapBiomas allowed per year (observed: < 0.01 %)

border_share:
  # share of each crop's observed area within these distances of a boundary with another
  # municipality (H2 predictor); computed from the coverage rasters for the reference years
  tif_pattern: "brazil_coverage-col11_{year}.tif"
  years: [2020, 2021, 2022, 2023, 2024]
  distances_m: [1000, 2000]
  window: 2048
  # the rasters must reproduce the Collection 11 municipal statistics: median |raster/stats − 1|
  # (Collection 10 rasters differ by 1–3 %)
  collection_tolerance: 0.005

reconcile:
  scales: [municipality, rgint, uf, nation]
  tolerances: [0.10, 0.25]   # share of units with |A_obs/A_dec − 1| <= tol
  min_area_ha: 50            # units where both sources are below this are not scored
  reference_years: [2020, 2021, 2022, 2023, 2024]
  # trend agreement: change between two windows (mean of each), units where both sources
  # report every year of both windows and reach trend_min_area_ha in all four means
  trend_windows: [[2008, 2012], [2020, 2024]]
  trend_min_area_ha: 100
  # bins of the size of the change, mean |Δlog| of the two sources: ln 1.10, ln 1.25, ln 1.50 (10, 25, 50 %)
  trend_magnitude_edges: [0.0953102, 0.2231436, 0.4054651]

analyse:
  # H2 models over the municipal log-ratio. years: default = reconcile.reference_years;
  # crops: default = every crop with an observed (MapBiomas) area
  years: null
  crops: null
  min_observations: 200

inventory:
  # Yield fallback when a municipality has observed area but no declared area
  yield_fallback: [rgint, uf, nation]

database:
  # `bbp load` writes every release into this schema and nowhere else.
  # Connection: BBP_DATABASE_URL in the environment or in .env (see .env.example).
  schema: bbp
  # SIDRA tables loaded into bbp.sidra (view bbp.v_sidra) for the PILAR-2b platform.
  # 5457 and 839 reach the database through crop_area; production value is not used.
  sidra_tables: [1612, 1613, 3939, 74, 94, 3940]
  sidra_exclude_variables: [value_thousand_brl]
  # processed/sanitation.parquet goes to bbp.sanitation (view bbp.v_sanitation)

# -----------------------------------------------------------------------------
# Processing plants (`bbp run plants` -> interim/plants.parquet, processed/plants*.parquet) and the crop area
# within reach of them (`bbp reach`, 30 m, resumable -> processed/reach_*.parquet). Paths relative to raw_root.
# `cutoff`: the date the source was exported (null = not recorded yet; reported as a warning).
# -----------------------------------------------------------------------------
plants:
  sources:
    anp_ethanol: {path: "00_Primary_Data_Sources_PILAR2b/14_Processing_Plants/anp/Plantas de etanol.csv",
                  label: "ANP — ethanol plants (Painel Dinâmico)", cutoff: null}
    anp_biodiesel: {path: "00_Primary_Data_Sources_PILAR2b/14_Processing_Plants/anp/Plantas de biodiesel.csv",
                    label: "ANP — biodiesel plants (Painel Dinâmico)", cutoff: null}
    # ANP biomethane open data: plants of the `snapshot` month operate; older plants are kept, not operating.
    # `history`: earlier snapshots summarised for the record only (plants_biomethane_snapshots).
    anp_biomethane:
      path: "biometano-dados-abertos/Biometano_DadosAbertos_CSV_Capacidade.csv"
      production: "biometano-dados-abertos/Biometano_DadosAbertos_CSV_Producao.csv"
      label: "ANP — biomethane open data (capacity, production)"
      snapshot: "08/2026"
      history: ["04/2026"]
      # figures quoted for the August 2026 cut-off (paper brief); checked, not used
      expected: {plants: 21, authorised_m3d: 1370000, produced_m3d: 530000}
      expected_tolerance: 0.02
    biogas: {path: "MapBiomas_Update_2025_Colecao_11/structure_biogas_plant/usina_biogas.shp",
             label: "CIBiogás BiogasMap (MapBiomas infrastructure layer)", cutoff: null}
    biomass_power: {path: "MapBiomas_Update_2025_Colecao_11/structure_biomass_thermal_power_plant/Usinas_Termele╠ütricas_UTE_Biomassa.shp",
                    label: "ANEEL SIGA biomass power plants (MapBiomas infrastructure layer)", cutoff: null}
    slaughterhouses: {path: "00_Primary_Data_Sources_PILAR2b/14_Processing_Plants/mapbiomas_infra/structure_slaughterhouse/frigorificos.shp",
                      label: "MAPA SIF slaughterhouses (MapBiomas infrastructure layer)", cutoff: null}
  # other registers of the cane mills: where the ANP mills are is checked against them (share within 2 km)
  registers:
    conab: {path: "00_Primary_Data_Sources_PILAR2b/14_Processing_Plants/conab/UNIDADE_PRODUCAO_ETANOL_ACUCAR_BR_ATIVAS_2025.zip",
            label: "CONAB active units 2025", min_share_2km: 0.70}
    epe: {path: "MapBiomas_Update_2025_Colecao_11/structure_ethanol_plant/usina_etanol.shp",
          label: "MapBiomas / EPE webmap 2018"}
  # one site, several functions: rows of these families closer than site_link_km are the same site
  site_links:
    - [sugarcane_mill, "biomass_power:bagasse"]
    - [biogas, "biomass_power:biogas"]
  site_link_km: 2.0
  duplicate_km: 2.0             # same family and source, closer than this, different sites: possible duplicate
  capacity_required: [sugarcane_mill, corn_ethanol, biodiesel, biomethane, biomass_power]
  reach:
    year: 2024                  # coverage raster and second-crop raster of this year
    radii_km: [10, 20, 30, 50, 75, 100]
    bin_km: 1                   # distance histograms: 1 km bins to max_km per municipality, to 2000 km nationally
    max_km: 150
    ring_max_km: 150            # sugarcane mills: cane area in 1 km rings up to this distance (as the exploratory x03)
    competition_km: 30          # plants of the paired family within this distance of each pixel
    competition_cap: 10
    # cane a mill needs: crushing class midpoint / yield (assumption, CONAB 2024/25 national ~75 t/ha)
    cane_yield_t_ha: 75
    window: 4096                # pixels per side of a processing window
    check_factor: 16            # aggregation check: the same distances from 480 m cell centres
    # crops by MapBiomas class: `coverage` classes of the coverage raster, `second_crop` values of the
    # second-crop raster; a pixel in both counts once
    crops:
      sugarcane: {coverage: [20]}
      soybean: {coverage: [39]}
      corn_2nd: {second_crop: [1]}
      all_crops: {coverage: [20, 35, 39, 40, 41, 46, 47, 48, 62], second_crop: [1, 41, 62]}
    pairs:
      - {crop: sugarcane, family: sugarcane_mill}
      - {crop: corn_2nd, family: corn_ethanol}
      - {crop: soybean, family: biodiesel}
      - {crop: all_crops, family: biogas}
      - {crop: all_crops, family: biomethane}
  # `bbp scale`: the reach of the pairs above at the pixel, the municipality and the intermediate region.
  # Rules for the units: area_fraction (main; the unit's crop spread like its land), centroid (sensitivity),
  # representative_point (the exploratory x05). An infinite radius is always added (convergence check).
  scale:
    radii_km: [10, 20, 30, 50, 75, 100, 150, 200, 300, 500, 1000, 2000]
    # share within 30 km in the exploratory x05 (480 m cells, April 2026 register, representative points);
    # compared, not used
    exploratory_x05:
      "sugarcane|sugarcane_mill": {pixel: 0.948, municipality: 0.919, rgint: 0.725}
      "corn_2nd|corn_ethanol": {pixel: 0.106, municipality: 0.110, rgint: 0.0005}
      "soybean|biodiesel": {pixel: 0.071, municipality: 0.097, rgint: 0.157}
      "all_crops|biogas": {pixel: 0.247, municipality: 0.249, rgint: 0.256}
      "all_crops|biomethane": {pixel: 0.0206, municipality: 0.0208, rgint: 0.017}

# -----------------------------------------------------------------------------
# Using the system (`bbp demo`): typology of the intermediate regions and the biomethane mandate ruler.
# -----------------------------------------------------------------------------
demo:
  year: 2024
  typology:
    min_crop_kha: 10              # regions with less crop area are 'minor agriculture', not clustered
    detection_share: 0.001        # parts below 0.1 % of a region's crop area are rounded zeros (CLR zero replacement)
    k_range: [2, 12]              # Ward on CLR
    select: stability             # k = best Ward/k-means agreement (ARI) among partitions with every cluster >= min_cluster
    min_cluster: 10
    seed: 0
    # priority: N1 in the top quartile and less than priority_share of all crops within priority_km of a biogas plant
    priority_n1_quantile: 0.75
    priority_share: 0.25
    priority_km: 30
    expected_priorities: ["Sinop", "Cuiabá", "Barreiras", "Passo Fundo"]   # named in the paper brief; checked, not forced
  mandate:
    # GHG reduction targets of the natural-gas market met with biomethane (Lei 14.993/2024). Volumes as stated by
    # the acts; a target without an official volume gets one from the base of `base_reference` (flagged derived).
    targets:
      - {year: 2026, ghg_reduction_pct: 0.5, volume_m3d: 504800, volume_m3_year: 181728000, status: "in force",
         act: "Resolução CNPE nº 4/2026, art. 3 (DOU 06/05/2026, Seção 1, p. 4)",
         url: "https://www.gov.br/mme/pt-br/assuntos/conselhos-e-comites/cnpe/resolucoes-do-cnpe/2026/resolucao-4-publicada.pdf",
         accessed: "2026-10-19"}
      - {year: 2027, ghg_reduction_pct: 1.0, volume_m3d: 995200, volume_m3_year: 363200000, base_reference: true,
         status: "proposed, public consultation", act: "Portaria MME nº 942/2026 (consultation opened 06/10/2026)",
         url: "https://www.gov.br/mme/pt-br/assuntos/noticias/mme-abre-consulta-publica-sobre-meta-de-reducao-de-emissoes-no-mercado-de-gas-natural-para-2027",
         accessed: "2026-10-19"}
      - {year: 2028, ghg_reduction_pct: 3.0, status: "indicative, under consultation", act: "Portaria MME nº 942/2026",
         url: "https://www.gov.br/mme/pt-br/assuntos/noticias/mme-abre-consulta-publica-sobre-meta-de-reducao-de-emissoes-no-mercado-de-gas-natural-para-2027",
         accessed: "2026-10-19"}
      - {year: 2029, ghg_reduction_pct: 4.0, status: "indicative, under consultation", act: "Portaria MME nº 942/2026",
         url: "https://www.gov.br/mme/pt-br/assuntos/noticias/mme-abre-consulta-publica-sobre-meta-de-reducao-de-emissoes-no-mercado-de-gas-natural-para-2027",
         accessed: "2026-10-19"}
      - {year: 2030, ghg_reduction_pct: 5.0, status: "indicative, under consultation", act: "Portaria MME nº 942/2026",
         url: "https://www.gov.br/mme/pt-br/assuntos/noticias/mme-abre-consulta-publica-sobre-meta-de-reducao-de-emissoes-no-mercado-de-gas-natural-para-2027",
         accessed: "2026-10-19"}
