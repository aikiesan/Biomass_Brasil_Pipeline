# =============================================================================
# Municipalities created after the start of the study period (2008)
# =============================================================================
# MapBiomas reports every year on the CURRENT municipal mesh; PAM reports a
# municipality only from its first year of existence. Before `first_pam_year`
# the area of a new municipality is still inside its parent(s) in PAM.
#
# `bbp run harmonise` builds Minimum Comparable Areas (AMC): each new
# municipality is merged with its parents into one unit, used for any analysis
# that spans the change. It also checks every code/name below against the IBGE
# mesh and reports any municipality that has data in MapBiomas but no PAM
# record in some year (so missing entries here are detected, not silently lost).
#
# `first_pam_year` is filled from the data by the harmonise stage when null.
# =============================================================================

changes:
  - code: 1504752
    name: "Mojuí dos Campos"
    uf: PA
    parents: [1506807]          # Santarém
    installed: 2013
    first_pam_year: null

  - code: 4212650
    name: "Pescaria Brava"
    uf: SC
    parents: [4209409]          # Laguna
    installed: 2013
    first_pam_year: null

  - code: 4220000
    name: "Balneário Rincão"
