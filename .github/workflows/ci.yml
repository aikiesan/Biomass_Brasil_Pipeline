name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: bbp_ci
          POSTGRES_USER: bbp
          POSTGRES_PASSWORD: bbp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbp -d bbp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BBP_TEST_DATABASE_URL: postgresql://bbp:bbp_ci@localhost:5432/bbp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (synthetic data + PostGIS load round-trip; no source data in CI)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t bbp:ci .
      - name: Smoke test
        run: docker run --rm bbp:ci --help
